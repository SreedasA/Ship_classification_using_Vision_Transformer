[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-vit-classification"
version = "1.0.0"
description = "Maritime ship image classification using a Vision Transformer (ViT)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sreedas A / Sreedas Anjankudy", email = "asreedas@gmail.com" }]
keywords = ["vision-transformer", "image-classification", "maritime", "pytorch", "huggingface"]
dependencies = [
  "accelerate>=0.27",
  "datasets>=2.14.5",
  "evaluate>=0.4",
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tensorboard>=2.14",
  "torch",
  "torchvision",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/SreedasA"
Repository = "https://github.com/SreedasA"
LinkedIn = "https://www.linkedin.com/in/sreedasa/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]
